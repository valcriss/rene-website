services:
  rene:
    image: ghcr.io/valcriss/rene-website:latest
    container_name: "rene"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL_FILE: /run/secrets/database_url
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      CRON_SECRET_FILE: /run/secrets/cron_secret
      PHOTON_URL: http://photon:2322
      SITE_URL: ${SITE_URL:?Set SITE_URL in the deployment environment}
      UPLOAD_DIR: /app/uploads
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in the deployment environment}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in the deployment environment}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SENDER_EMAIL: ${SENDER_EMAIL:?Set SENDER_EMAIL in the deployment environment}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      photon:
        condition: service_started
    volumes:
      - uploads-data:/app/uploads
    secrets:
      - database_url
      - migration_database_url
      - jwt_secret
      - cron_secret
      - smtp_password
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:?Set POSTGRES_MIGRATION_USER in the deployment environment}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_migration_password
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the deployment environment}
      APP_DATABASE_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in the deployment environment}
      APP_DATABASE_PASSWORD_FILE: /run/secrets/postgres_app_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    secrets:
      - postgres_migration_password
      - postgres_app_password
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5

  photon-init:
    image: debian:bookworm-slim
    container_name: photon-init
    environment:
      PHOTON_VERSION: 0.7.4
      PHOTON_DB_URL: https://download1.graphhopper.com/public/experimental/extracts/by-country-code/fr/photon-db-fr-250720.tar.bz2
    volumes:
      - photon-data:/photon
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl bzip2 tar
        rm -rf /var/lib/apt/lists/*

        mkdir -p /photon/bin /photon/data

        JAR_OPENSEARCH="/photon/bin/photon-opensearch-$${PHOTON_VERSION}.jar"
        JAR_STANDARD="/photon/bin/photon-$${PHOTON_VERSION}.jar"
        JAR="/photon/bin/photon.jar"
        if curl -fsI "https://github.com/komoot/photon/releases/download/$${PHOTON_VERSION}/photon-opensearch-$${PHOTON_VERSION}.jar" >/dev/null; then
          JAR_VERSIONED="$${JAR_OPENSEARCH}"
          JAR_FLAVOR="opensearch"
          JAR_URL="https://github.com/komoot/photon/releases/download/$${PHOTON_VERSION}/photon-opensearch-$${PHOTON_VERSION}.jar"
        else
          JAR_VERSIONED="$${JAR_STANDARD}"
          JAR_FLAVOR="standard"
          JAR_URL="https://github.com/komoot/photon/releases/download/$${PHOTON_VERSION}/photon-$${PHOTON_VERSION}.jar"
        fi

        if [ ! -f "$${JAR_VERSIONED}" ]; then
          echo "Downloading Photon jar $${PHOTON_VERSION}..."
          curl -fL -o "$${JAR_VERSIONED}" "$${JAR_URL}"
        else
          echo "Jar already present: $${JAR_VERSIONED}"
        fi
        ln -sf "$${JAR_VERSIONED}" "$${JAR}"

        DB_MARKER="/photon/data/.photon-db-source"
        EXPECTED_DB_SOURCE="$${PHOTON_VERSION}:$${JAR_FLAVOR}:$${PHOTON_DB_URL}"

        # Photon attend un index OpenSearch sous /photon/data/photon_data/...
        if [ -d "/photon/data/photon_data/node_1/data/nodes/0/indices" ] && \
          [ -f "$${DB_MARKER}" ] && \
          [ "$$(cat "$${DB_MARKER}")" = "$${EXPECTED_DB_SOURCE}" ] && \
          find "/photon/data/photon_data/node_1/data/nodes/0/indices" -mindepth 1 -print -quit | grep -q .; then
          echo "Photon index already present, skipping DB download."
        else
          echo "Photon index missing, incomplete, or built for another runtime. Resetting local data."
          rm -rf /photon/data/photon_data
          rm -f "$${DB_MARKER}"
          echo "Downloading & extracting Photon DB dump..."
          curl -fL "$${PHOTON_DB_URL}" | bzip2 -cd | tar -x -C /photon/data
          printf '%s' "$${EXPECTED_DB_SOURCE}" > "$${DB_MARKER}"
        fi

        echo "Init done."
    restart: "no"

  photon:
    image: eclipse-temurin:21-jre
    container_name: photon
    depends_on:
      photon-init:
        condition: service_completed_successfully
    volumes:
      - photon-data:/photon
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        exec java -jar "/photon/bin/photon.jar" \
          -data-dir "/photon/data" \
          -listen-ip "0.0.0.0" \
          -listen-port "2322"
    restart: unless-stopped

volumes:
  db-data:
  photon-data:
  uploads-data:

secrets:
  database_url:
    file: ${DATABASE_URL_SECRET_FILE:?Set DATABASE_URL_SECRET_FILE in the deployment environment}
  migration_database_url:
    file: ${MIGRATION_DATABASE_URL_SECRET_FILE:?Set MIGRATION_DATABASE_URL_SECRET_FILE in the deployment environment}
  jwt_secret:
    file: ${JWT_SECRET_FILE:?Set JWT_SECRET_FILE in the deployment environment}
  cron_secret:
    file: ${CRON_SECRET_FILE:?Set CRON_SECRET_FILE in the deployment environment}
  smtp_password:
    file: ${SMTP_PASSWORD_SECRET_FILE:?Set SMTP_PASSWORD_SECRET_FILE in the deployment environment}
  postgres_migration_password:
    file: ${POSTGRES_MIGRATION_PASSWORD_SECRET_FILE:?Set POSTGRES_MIGRATION_PASSWORD_SECRET_FILE in the deployment environment}
  postgres_app_password:
    file: ${POSTGRES_APP_PASSWORD_SECRET_FILE:?Set POSTGRES_APP_PASSWORD_SECRET_FILE in the deployment environment}
