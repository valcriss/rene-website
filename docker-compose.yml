services:
  rene:
    image: ghcr.io/valcriss/rene-website:latest
    container_name: "rene"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL_FILE: /run/secrets/database_url
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      CRON_SECRET_FILE: /run/secrets/cron_secret
      PHOTON_URL: http://photon:2322
      SITE_URL: ${SITE_URL:?Set SITE_URL in the deployment environment}
      UPLOAD_DIR: /app/uploads
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in the deployment environment}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in the deployment environment}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SENDER_EMAIL: ${SENDER_EMAIL:?Set SENDER_EMAIL in the deployment environment}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      PHOTON_TIMEOUT_MS: ${PHOTON_TIMEOUT_MS:-3000}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-10000}
      CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-false}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://r3ne.art}
    networks:
      - default
      - shared_network
    depends_on:
      db:
        condition: service_healthy
      photon:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads
    secrets:
      - database_url
      - migration_database_url
      - jwt_secret
      - cron_secret
      - smtp_password
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

  db:
    image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
    user: "999:999"
    environment:
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:?Set POSTGRES_MIGRATION_USER in the deployment environment}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_migration_password
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the deployment environment}
      APP_DATABASE_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in the deployment environment}
      APP_DATABASE_PASSWORD_FILE: /run/secrets/postgres_app_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    secrets:
      - postgres_migration_password
      - postgres_app_password
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  photon:
    image: rtuszik/photon-docker:2.5.0@sha256:c5babeb0ac396b485822036cf3c69e54fb6c79d699328a4e042e11bbd6f73f1a
    container_name: photon
    environment:
      REGION: ${PHOTON_REGION:-france}
      # PARALLEL: the new index is downloaded in the background then swapped in (needs 2x disk).
      UPDATE_STRATEGY: PARALLEL
      UPDATE_INTERVAL: ${PHOTON_UPDATE_INTERVAL:-720h}
    volumes:
      - photon-data-v2:/photon/data
    # 9011 is the image's own "photon" user: a fresh named volume inherits its ownership, so the
    # container never needs root (PUID/PGID are ignored when `user:` is set).
    user: "9011:9011"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Only the grace period is overridden: the image keeps its own probe (HTTP /status). On a
      # fresh volume Photon first downloads and unpacks the France index (~5 GB, about 10 minutes
      # on a good link) and failures during start_period do not count. With the image default of
      # 4 minutes, `rene` (which waits for a healthy photon) never started on the first deploy.
      start_period: 20m
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512

networks:
  default:
  shared_network:
    external: true

volumes:
  db-data:
  photon-data-v2:
  uploads-data:

secrets:
  database_url:
    file: ${DATABASE_URL_SECRET_FILE:?Set DATABASE_URL_SECRET_FILE in the deployment environment}
  migration_database_url:
    file: ${MIGRATION_DATABASE_URL_SECRET_FILE:?Set MIGRATION_DATABASE_URL_SECRET_FILE in the deployment environment}
  jwt_secret:
    file: ${JWT_SECRET_FILE:?Set JWT_SECRET_FILE in the deployment environment}
  cron_secret:
    file: ${CRON_SECRET_FILE:?Set CRON_SECRET_FILE in the deployment environment}
  smtp_password:
    file: ${SMTP_PASSWORD_SECRET_FILE:?Set SMTP_PASSWORD_SECRET_FILE in the deployment environment}
  postgres_migration_password:
    file: ${POSTGRES_MIGRATION_PASSWORD_SECRET_FILE:?Set POSTGRES_MIGRATION_PASSWORD_SECRET_FILE in the deployment environment}
  postgres_app_password:
    file: ${POSTGRES_APP_PASSWORD_SECRET_FILE:?Set POSTGRES_APP_PASSWORD_SECRET_FILE in the deployment environment}
