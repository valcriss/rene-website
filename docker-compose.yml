services:
  rene:
    image: ghcr.io/valcriss/rene-website:latest
    container_name: "rene"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL_FILE: /run/secrets/database_url
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      CRON_SECRET_FILE: /run/secrets/cron_secret
      PHOTON_URL: http://photon:2322
      SITE_URL: ${SITE_URL:?Set SITE_URL in the deployment environment}
      UPLOAD_DIR: /app/uploads
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in the deployment environment}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER in the deployment environment}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SENDER_EMAIL: ${SENDER_EMAIL:?Set SENDER_EMAIL in the deployment environment}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      PHOTON_TIMEOUT_MS: ${PHOTON_TIMEOUT_MS:-3000}
      SMTP_TIMEOUT_MS: ${SMTP_TIMEOUT_MS:-10000}
      CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-false}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://r3ne.art}
    networks:
      - default
      - shared_network
    depends_on:
      db:
        condition: service_healthy
      photon:
        condition: service_healthy
    volumes:
      - uploads-data:/app/uploads
    secrets:
      - database_url
      - migration_database_url
      - jwt_secret
      - cron_secret
      - smtp_password
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256

  db:
    image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
    user: "999:999"
    environment:
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:?Set POSTGRES_MIGRATION_USER in the deployment environment}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_migration_password
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the deployment environment}
      APP_DATABASE_USER: ${POSTGRES_APP_USER:?Set POSTGRES_APP_USER in the deployment environment}
      APP_DATABASE_PASSWORD_FILE: /run/secrets/postgres_app_password
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    secrets:
      - postgres_migration_password
      - postgres_app_password
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  photon-init:
    image: debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
    container_name: photon-init
    environment:
      PHOTON_VERSION: ${PHOTON_VERSION:-1.3.0}
      PHOTON_JAR_URL: ${PHOTON_JAR_URL:?Set PHOTON_JAR_URL in the deployment environment}
      PHOTON_JAR_SHA256: ${PHOTON_JAR_SHA256:?Set PHOTON_JAR_SHA256 in the deployment environment}
      PHOTON_DB_URL: ${PHOTON_DB_URL:?Set PHOTON_DB_URL in the deployment environment}
      PHOTON_DB_SHA256: ${PHOTON_DB_SHA256:?Set PHOTON_DB_SHA256 in the deployment environment}
    volumes:
      - photon-data:/photon
    configs:
      - source: photon-init-script
        target: /usr/local/bin/photon-init.sh
        mode: 0555
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl bzip2 tar
        rm -rf /var/lib/apt/lists/*

        exec /usr/local/bin/photon-init.sh
    restart: "no"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  photon:
    image: eclipse-temurin:21-jre@sha256:49e21e16e3c86eb7816a44a67549910ed090fbeb40c29c525d58bf5e02e91b0f
    container_name: photon
    depends_on:
      photon-init:
        condition: service_completed_successfully
    volumes:
      - photon-data:/photon
    user: "65532:65532"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        exec java -jar "/photon/bin/photon.jar" serve \
          -data-dir "/photon/data" \
          -listen-ip "0.0.0.0" \
          -listen-port "2322"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # No curl/wget in eclipse-temurin's JRE image (that's why photon-init uses a separate
      # debian image for its download step); a bare TCP connect via bash's /dev/tcp is enough to
      # tell "the JVM has bound the port" from "still loading the index into memory".
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2322 && exec 3<&-"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512

networks:
  default:
  shared_network:
    external: true

volumes:
  db-data:
  photon-data:
  uploads-data:

secrets:
  database_url:
    file: ${DATABASE_URL_SECRET_FILE:?Set DATABASE_URL_SECRET_FILE in the deployment environment}
  migration_database_url:
    file: ${MIGRATION_DATABASE_URL_SECRET_FILE:?Set MIGRATION_DATABASE_URL_SECRET_FILE in the deployment environment}
  jwt_secret:
    file: ${JWT_SECRET_FILE:?Set JWT_SECRET_FILE in the deployment environment}
  cron_secret:
    file: ${CRON_SECRET_FILE:?Set CRON_SECRET_FILE in the deployment environment}
  smtp_password:
    file: ${SMTP_PASSWORD_SECRET_FILE:?Set SMTP_PASSWORD_SECRET_FILE in the deployment environment}
  postgres_migration_password:
    file: ${POSTGRES_MIGRATION_PASSWORD_SECRET_FILE:?Set POSTGRES_MIGRATION_PASSWORD_SECRET_FILE in the deployment environment}
  postgres_app_password:
    file: ${POSTGRES_APP_PASSWORD_SECRET_FILE:?Set POSTGRES_APP_PASSWORD_SECRET_FILE in the deployment environment}

configs:
  photon-init-script:
    file: ./docker/photon-init.sh
