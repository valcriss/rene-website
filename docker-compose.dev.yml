services:
  db:
    image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  photon-init:
    image: debian:bookworm-slim@sha256:3783cc01769c7b2b1b83a5c5ad96c815348e28ed7da68e2e3687004faa906251
    container_name: photon-init
    volumes:
      - ./photon:/photon
    configs:
      - source: photon-init-script
        target: /usr/local/bin/photon-init.sh
        mode: 0555
    env_file:
      - .env
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl bzip2 tar
        rm -rf /var/lib/apt/lists/*

        exec /usr/local/bin/photon-init.sh
    restart: "no"

  photon:
    image: eclipse-temurin:21-jre@sha256:49e21e16e3c86eb7816a44a67549910ed090fbeb40c29c525d58bf5e02e91b0f
    container_name: photon
    depends_on:
      photon-init:
        condition: service_completed_successfully
    env_file:
      - .env
    ports:
      - "${PHOTON_PORT}:2322"
    volumes:
      - ./photon:/photon
    user: "65532:65532"
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        exec java -jar "/photon/bin/photon.jar" serve \
          -data-dir "/photon/data" \
          -listen-ip "0.0.0.0" \
          -listen-port "2322"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2322 && exec 3<&-"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  db-data:

configs:
  photon-init-script:
    file: ./docker/photon-init.sh
