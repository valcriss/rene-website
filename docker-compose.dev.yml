services:
  db:
    image: postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  photon:
    image: rtuszik/photon-docker:2.5.0@sha256:c5babeb0ac396b485822036cf3c69e54fb6c79d699328a4e042e11bbd6f73f1a
    container_name: photon
    environment:
      REGION: ${PHOTON_REGION:-france}
      UPDATE_STRATEGY: PARALLEL
      UPDATE_INTERVAL: ${PHOTON_UPDATE_INTERVAL:-720h}
    ports:
      - "${PHOTON_PORT:-2322}:2322"
    volumes:
      - photon-data:/photon/data
    restart: unless-stopped

volumes:
  db-data:
  photon-data:
