<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R3ne</title>
    <!--
      Loaded as HTML <link> tags rather than a CSS @import: an @import inside styles.css would
      force the browser to fetch and parse that stylesheet before it even discovers the Google
      Fonts request, adding a full extra round trip to the critical rendering path.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
    />
  </head>
  <body class="bg-slate-50">
    <div id="app"><!--ssr-outlet--></div>
    <!--ssr-state-->
    <script type="module" src="/src/entry-client.ts"></script>
  </body>
</html>
