name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:security
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run check:bundle-size -w frontend
      - run: docker build --tag rene-website:ci .
      - name: Verify rootless immutable runtime
        run: |
          docker run --rm --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 \
            --tmpfs /app/uploads:rw,nosuid,size=64m,mode=1777 \
            --entrypoint sh rene-website:ci -ec \
            'test "$(id -u)" = "10001"; touch /tmp/allowed; touch /app/uploads/allowed; ! touch /app/outside-allowed'
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: rene-website:ci
          format: table
          exit-code: "1"
          ignore-unfixed: false
          scanners: vuln
          severity: HIGH,CRITICAL
