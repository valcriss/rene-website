version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 no longer exposes the JavaScript compiler API: ts-jest (peer typescript <7) and
      # typescript-eslint (peer <6.1) cannot run with it. Revisit once both support it (see #110).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Node typings follow the supported runtime (engines/CI/Docker: Node 26), not newer releases.
      # Raise this bound together with the runtime.
      - dependency-name: "@types/node"
        versions: [">=27"]
      # Prisma stays on 6.12.x until the Prisma 7 migration:
      # - 6.13+ pulls in deepmerge-ts <8 through @prisma/config (CVE-2026-40345, HIGH), which fails
      #   npm audit and Trivy; the fix only exists in Prisma 7;
      # - Prisma 7 changes how the client is generated and imported (no PrismaClient export from
      #   @prisma/client), so it needs its own migration rather than a grouped bump.
      - dependency-name: "prisma"
        versions: [">=6.13.0"]
      - dependency-name: "@prisma/client"
        versions: [">=6.13.0"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
